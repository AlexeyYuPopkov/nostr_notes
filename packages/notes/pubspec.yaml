  equatable: ^2.0.8
  
  shared_preferences: ^2.5.5
  flutter_svg: ^2.2.4
  go_router: ^16.3.0 
  uuid: ^4.5.3
  collection: ^1.19.0
  rxdart: ^0.28.0
  di_storage: ^2.0.1
  local_auth: ^3.0.1
  drift: ^2.32.1
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0


  custom_adaptive_scaffold: ^2.0.2
  shimmer: ^3.0.0
  # flutter_markdown: ^0.7.7+1
  gpt_markdown: ^1.1.5
  highlight: ^0.7.0
