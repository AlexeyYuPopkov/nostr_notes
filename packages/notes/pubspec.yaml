  crypto: ^3.0.7
  cryptography: ^2.9.0
  convert: ^3.1.2
  elliptic: ^0.3.12
  # cryptography_plus: ^2.7.0
  # cryptography_flutter_plus: ^2.3.2 


  # freezed_annotation: ^3.0.0
  json_annotation: ^4.11.0

