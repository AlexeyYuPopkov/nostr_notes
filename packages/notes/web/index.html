<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Link previews. Absolute URLs only: crawlers do not resolve these

  <meta property="og:site_name" content="Private Notes (Nostr)">
  <meta property="og:title" content="Private Notes (Nostr)">
  <meta property="og:description" content="End-to-end encrypted notes and passwords, stored on your own relays. No server, no sign-up — only your keypair.">
  <meta property="og:url" content="https://alexeyyupopkov.github.io/">

  <meta name="twitter:title" content="Private Notes (Nostr)">
  <meta name="twitter:description" content="End-to-end encrypted notes and passwords, stored on your own relays. No server, no sign-up — only your keypair.">
  <meta name="twitter:image" content="https://alexeyyupopkov.github.io/icons/Icon-512.png">

  <title>Private Notes (Nostr)</title>
  <link rel="manifest" href="manifest.json">
