name: common
description: common package for nostr workspace
version: 0.0.1
publish_to: none
environment:
  sdk: ">=3.11.0 <4.0.0"

# Melos
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
