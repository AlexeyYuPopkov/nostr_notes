name: common
description: common package for nostr workspace
version: 0.0.1
publish_to: none
environment:
  sdk: ">=3.11.0 <4.0.0"

# Melos
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  nostr:
    path: ../nostr

  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9

  di_storage: ^2.0.1
  # auto_route: ^11.1.0
  meta: ^1.17.0
  # flutter_bloc: ^9.1.1
  # riverpod: ^3.2.1


  uuid: ^4.5.3
  rxdart: ^0.28.0
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  connectivity_plus: ^7.1.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5

  collection: ^1.19.0
  json_annotation: ^4.11.0

  flutter_svg: ^2.2.4
  url_launcher: ^6.3.2
  gpt_markdown: ^1.1.5

  intl: any
  flutter_localizations:
    sdk: flutter
  flutter_highlight: any
  nostr_notes: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.13.1

  json_serializable: ^6.9.5
  auto_route_generator: ^10.5.0
  # lean_builder: ^0.1.7

  mocktail: ^1.0.4
  drift_dev: ^2.32.1
  # fake_async: ^1.3.3
  # sqlite3: ^3.2.0
  # ffigen: ^20.1.1

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true 

  assets:
    - assets/images/

simple_splash_view:
  background_color: "#FDFCF9"
  background_color_dark: "#1A1A1A"
  duration: 300
  theme:
    mode: system