name: webrtc_call
description: 1-1 WebRTC calls on flutter_webrtc behind a replaceable signaling channel. Knows nothing about Nostr or the app's DI and routing.
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.3
  material_ui: any
  web_socket_channel: ^3.0.3
  equatable: ^3.0.0
  crypto: ^3.0.7
  meta: ^1.17.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: '>=2.13.1 <2.16.2'
  json_serializable: ^6.9.5
