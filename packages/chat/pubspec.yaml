name: chat
description: Nostr chat
version: 0.0.1
publish_to: none
environment:
  sdk: ">=3.11.0 <4.0.0"

# Melos
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  common:
    path: ../common

  nostr:
    path: ../nostr
    
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9

  get_it: ^9.2.1
  auto_route: ^11.1.0
  meta: ^1.17.0
  # flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  uuid: ^4.5.3
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5

  collection: ^1.19.0
  equatable: ^2.0.8
  json_annotation: ^4.11.0

  flutter_svg: ^2.2.4
  gpt_markdown: any

  flutter_localizations:
    sdk: flutter
  intl: any
dependency_overrides:
  analyzer: ^10.0.0 # https://github.com/rrousselGit/riverpod/issues/4698
  dart_style: 3.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.13.1

  json_serializable: ^6.9.5
  auto_route_generator: ^10.5.0
  riverpod_generator: ^4.0.3
  # lean_builder: ^0.1.7

  mocktail: ^1.0.4
  # fake_async: ^1.3.3
  # sqlite3: ^3.2.0
  # ffigen: ^20.1.1

flutter:
  uses-material-design: true
  generate: true 
  config:
    enable-swift-package-manager: true 
