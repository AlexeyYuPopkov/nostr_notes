<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16202E"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1E6FB0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1000" height="420" fill="url(#bg)"/>

  <!-- relay network (right) -->
  <g stroke="#2A3A4D" stroke-width="1.5" opacity="0.9">
    <line x1="820" y1="210" x2="872" y2="104"/>
    <line x1="820" y1="210" x2="930" y2="200"/>
    <line x1="820" y1="210" x2="900" y2="312"/>
    <line x1="820" y1="210" x2="752" y2="318"/>
    <line x1="820" y1="210" x2="742" y2="116"/>
  </g>

  <!-- neutral node -->
  <circle cx="742" cy="116" r="7" fill="#5B6B7E"/>

  <!-- "fits" nodes (green) -->
  <circle cx="872" cy="104" r="15" fill="#143322"/>
  <text x="872" y="110" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4CD787" text-anchor="middle">✓</text>
  <circle cx="930" cy="200" r="15" fill="#143322"/>
  <text x="930" y="206" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4CD787" text-anchor="middle">✓</text>

  <!-- "doesn't fit" nodes (red) -->
  <circle cx="900" cy="312" r="15" fill="#3A1E22"/>
  <text x="900" y="318" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FF6B72" text-anchor="middle">✗</text>
  <circle cx="752" cy="318" r="15" fill="#3A1E22"/>
  <text x="752" y="324" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FF6B72" text-anchor="middle">✗</text>

  <!-- central hub -->
  <circle cx="820" cy="210" r="23" fill="url(#hubGlow)" filter="url(#soft)"/>
  <circle cx="820" cy="210" r="23" fill="none" stroke="#BAE6FD" stroke-width="1.5"/>

  <!-- title block (left) -->
  <text x="64" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Nostr</text>
  <text x="68" y="250" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="500" fill="#AEB9C7">a backend «out of the box»</text>
  <text x="68" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#38BDF8">where it fits — and where it doesn&apos;t</text>
</svg>
