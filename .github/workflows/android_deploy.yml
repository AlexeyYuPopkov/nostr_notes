name: Android CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Download keystore
        run: echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 -d > packages/notes/android/upload-keystore.jks

      - name: Copy keystore to app folder
        run: cp packages/notes/android/upload-keystore.jks packages/notes/android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > packages/notes/android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> packages/notes/android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> packages/notes/android/key.properties
          echo "storeFile=upload-keystore.jks" >> packages/notes/android/key.properties

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: packages/notes/android

      - name: Install Fastlane
        working-directory: packages/notes/android
        run: bundle install

      - name: Setup Google Play credentials
        run: echo '${{ secrets.ANDROID_JSON_KEY_DATA }}' > packages/notes/android/fastlane/play_store_credentials.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install melos
        run: dart pub global activate melos

      - name: Install dependencies
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Build and deploy
        working-directory: packages/notes/android
        run: bundle exec fastlane deploy
        env:
          SUPPLY_JSON_KEY_FILE: fastlane/play_store_credentials.json

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: packages/notes/build/debug-info/

      - name: Commit version update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add packages/notes/pubspec.yaml
          VERSION=$(grep 'version: ' packages/notes/pubspec.yaml | cut -d' ' -f2)
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push
