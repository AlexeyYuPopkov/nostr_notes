<svg width="780" height="440" viewBox="0 0 780 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="780" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20203A"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B8CFF"/>
      <stop offset="1" stop-color="#5B4BD6"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="780" height="440" fill="url(#bg)"/>

  <!-- relay network (right) -->
  <g stroke="#3A3A5C" stroke-width="1.5" opacity="0.9">
    <line x1="610" y1="220" x2="660" y2="110"/>
    <line x1="610" y1="220" x2="712" y2="208"/>
    <line x1="610" y1="220" x2="690" y2="322"/>
    <line x1="610" y1="220" x2="560" y2="330"/>
    <line x1="610" y1="220" x2="540" y2="128"/>
  </g>

  <!-- neutral nodes -->
  <circle cx="540" cy="128" r="7" fill="#6E6E8F"/>

  <!-- "подходит" nodes (green) -->
  <circle cx="660" cy="110" r="14" fill="#1E3A2A"/>
  <text x="660" y="115" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#4CD787" text-anchor="middle">✓</text>
  <circle cx="712" cy="208" r="14" fill="#1E3A2A"/>
  <text x="712" y="213" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#4CD787" text-anchor="middle">✓</text>

  <!-- "не подходит" nodes (red) -->
  <circle cx="690" cy="322" r="14" fill="#3A1E22"/>
  <text x="690" y="327" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FF6B72" text-anchor="middle">✗</text>
  <circle cx="560" cy="330" r="14" fill="#3A1E22"/>
  <text x="560" y="335" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FF6B72" text-anchor="middle">✗</text>

  <!-- central hub -->
  <circle cx="610" cy="220" r="22" fill="url(#hubGlow)" filter="url(#soft)"/>
  <circle cx="610" cy="220" r="22" fill="none" stroke="#C9C2FF" stroke-width="1.5"/>

  <!-- title block (left) -->
  <text x="56" y="206" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Nostr</text>
  <text x="60" y="260" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#BFC0D4">бэкенд «из коробки»</text>
  <text x="60" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#9B8CFF">где подходит, а где нет</text>
</svg>
